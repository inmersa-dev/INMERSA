<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>INMERSA — Puesto Médico</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0A1628;
    font-family:'Nunito',system-ui,sans-serif;color:#fff;
    -webkit-tap-highlight-color:transparent;user-select:none}

  /* Cierre mínimo */
  #done{position:fixed;inset:0;z-index:60;background:rgba(10,22,40,.96);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:36px;text-align:center}
  #done.show{display:flex}
  #done .tick{font-size:52px}
  #done h2{font-size:20px;font-weight:900;margin:0}
  #done p{font-size:14px;color:#8899AA;max-width:300px;margin:0;line-height:1.6}
  #done .k{color:#00D4FF;font-weight:800}
</style>
</head>
<body>

<div id="done">
  <div class="tick">🩺</div>
  <h2>Puesto médico completado</h2>
  <p>Thomas ya sabe que tiene un poco de <span class="k">anemia</span>. Max lo cuidará de ahora en adelante.</p>
  <p style="font-size:12px;color:#5b6b7e">(Aquí continuará el campamento.)</p>
</div>

<audio id="bg-music" loop src="Audio/musica_paso1.mp3"></audio>

<script type="module">
import { createScene } from "./juegos/scene-engine.js?v=5";

// Bypass de caché mientras iteramos.
const V = '?v=1';
const A = s => 'Imagenes/carpa/' + s + V;

// Posición fija de cada cuadro de texto, en coordenadas del FONDO (0–1):
//   Max   → sobre la pizarra (izquierda)
//   Thomas→ sobre el letrero "PUESTO MÉDICO" (centro)
//   Sina  → sobre la bandera verde (derecha)
const BOX = {
  max:    { bx:0.15,  by:0.17 },
  thomas: { bx:0.595, by:0.17 },
  sina:   { bx:0.82,  by:0.17 },
};

const scene = createScene({
  stage: A('fondo_carpa_activo.png'),
  moments: 4,

  cast: {
    // ── Sina: la doctora (neurona). Capa individual, 2 poses. ──────
    sina: {
      name:'Sina', color:'#2D9CDB',
      x:0.72, bottom:0.015, height:0.72, width:0.28, headTop:0.60,
      shadow:{ width:0.11, height:0.022, bottom:0.03 },
      framing:{ scale:1.2, target:0.66, ty:0.08 },   // foco sutil a la derecha
      expressions:{
        worried: A('sina_worried.png'),   // original, solo movida a la derecha
        serious: A('sina_serious.png'),
      },
    },

    // ── Dúo Max+Thomas: bondeados (siempre en contacto), 3 poses. ──
    duo: {
      name:'', color:'#fff',
      x:0.42, bottom:0.0, height:0.90, width:0.62, headTop:0.18,
      shadow:{ width:0.34, height:0.03, bottom:0.02 },
      framing:{ scale:1, target:0.5, ty:0 },
      expressions:{
        dizzy:     A('duo_dizzy.png'),      // base
        defensive: A('duo_defensive.png'),
        warm:      A('duo_warm.png'),
      },
    },

    // ── Anclas fantasma: sin imagen, solo dan nombre/color/posición
    //    de burbuja para cada hablante que comparte la capa "duo". ──
    max: {
      name:'Max', color:'#E67E22',
      x:0.34, bottom:0, height:0.01, width:0.01, headTop:0.62,
      shadow:false, expressions:{},
      framing:{ scale:1.2, target:0.41, ty:0.08 },   // foco sutil a la izquierda
    },
    thomas: {
      name:'Thomas', color:'#B7791F',
      x:0.50, bottom:0, height:0.01, width:0.01, headTop:0.64,
      shadow:false, expressions:{},
      framing:{ scale:1.2, target:0.50, ty:0.08 },   // foco sutil al centro
    },
  },

  script: [
    // ── Panel 1: Thomas mareado, Max lo sostiene, Sina preocupada ──
    { m:0, who:'max',    box:BOX.max,    exp:{duo:'dizzy', sina:'worried'},
      text:'Lo traje porque estaba mareado.' },
    { m:0, who:'sina',   box:BOX.sina,
      text:'Revisé su ficha médica. Thomas tiene un poco de anemia.' },
    { m:0, who:'sina',   box:BOX.sina,
      text:'Por eso a veces se siente débil o mareado.' },

    // ── Panel 2: Thomas a la defensiva ─────────────────────────────
    { m:1, who:'thomas', box:BOX.thomas, exp:{duo:'defensive'},
      text:'Estoy bien. Fue que no desayuné, nada más.' },

    // ── Panel 3: Sina seria, corrigiendo ───────────────────────────
    { m:2, who:'sina',   box:BOX.sina,   exp:{sina:'serious'},
      text:'No es solo el desayuno, Thomas.' },

    // ── Panel 4: Max cálido/protector ──────────────────────────────
    { m:3, who:'max',    box:BOX.max,    exp:{duo:'warm'},
      text:'Nadie te va a sacar del campamento.' },
    { m:3, who:'max',    box:BOX.max,    act:'end',
      text:'Pero de ahora en adelante, con cuidado. ¿Está bien?' },
  ],

  onEnd: finish,
});

function finish() {
  // Sub-escena del capítulo 1: avisa a capitulo1.html para que avance, pero
  // NO reclama un nodo del mapa (antes decía paso:2/completado:true y, abierta
  // suelta, daba por completado el nodo 2). El nodo lo cierra capitulo1.html.
  window.parent.postMessage(
    {tipo:'resultado_juego',paso:1,puntos:0,completado:false,tiempo_segundos:0},'*');
  document.getElementById('done').classList.add('show');
}

// ── Música ───────────────────────────────────────────────────────
const music = document.getElementById('bg-music');
music.volume = 0.3;
document.addEventListener('click', () => music.play().catch(()=>{}), {once:true});

scene.start();
</script>
</body>
</html>
