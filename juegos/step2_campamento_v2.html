<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>INMERSA — El Guía Presenta la Competencia</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0A1628;
    font-family:'Nunito',system-ui,sans-serif;color:#fff;
    -webkit-tap-highlight-color:transparent;user-select:none}
  /* Swap duro: el cambio de pose de un reactor es casi instantáneo (no cross-fade),
     así no hay fantasmeo entre variantes generadas por separado. Solo afecta a esta escena. */
  .se-char img{transition:opacity .07s linear !important}
  #result{position:fixed;inset:0;z-index:50;background:rgba(10,22,40,.97);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:36px;text-align:center}
  #result.show{display:flex}
  .hito-badge{font-size:60px;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(0,212,255,.4))}
    50%{transform:scale(1.08);filter:drop-shadow(0 0 20px rgba(0,212,255,.8))}}
  .hito-label{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#00D4FF}
  #result h2{font-size:21px;font-weight:900;margin:0}
  #result p{font-size:14px;color:#8899AA;line-height:1.6;max-width:320px;margin:0}
  .btn{margin-top:8px;background:#00D4FF;color:#000;font-family:'Nunito',sans-serif;
    font-size:16px;font-weight:800;padding:14px 36px;border:none;border-radius:12px;cursor:pointer}
</style>
</head>
<body>

<div id="result">
  <div class="hito-badge">🏕️</div>
  <div class="hito-label">✦ Hito Completado ✦</div>
  <h2>El Guía Presenta la Competencia</h2>
  <p>Ya conoces las reglas. ¡Que empiece la competencia!</p>
  <button class="btn" id="finish-btn">Continuar →</button>
</div>

<audio id="bg-music" loop src="../Audio/musica_paso1.mp3"></audio>

<script type="module">
import { initializeApp }              from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { createScene }                from "./scene-engine.js?v=10";

const app = initializeApp({
  apiKey:"AIzaSyARclfJXsjDISiT2JRjzwkoUrmPpGqpho4", authDomain:"inmersa-mvp.firebaseapp.com",
  projectId:"inmersa-mvp", storageBucket:"inmersa-mvp.firebasestorage.app",
  messagingSenderId:"554325663285", appId:"1:554325663285:web:332e863d1e39e49783db7c",
  measurementId:"G-RQPE6SVTDP"
});
const auth = getAuth(app);
const db   = getFirestore(app);
let uid = null;

const S = { playerName:'', exact:false };
const p = () => S.playerName || 'tú';

const V = '?v=6';
const A = s => '../Imagenes/reglas/' + s + V;

const scene = createScene({
  // Escena reorientada: cámara por encima del hombro de los campistas, que se
  // sientan de espaldas en el escalón. El fondo es el boceto aprobado con los
  // cinco personajes borrados.
  stage: A('fondo.png'),
  // La geometría del reparto está medida sobre la imagen de fondo, así que el
  // motor debe aplicarle el mismo recorte que al escenario. Sin esto, en 16:9
  // el fondo se recorta un 25% y los personajes flotan 70px sobre el suelo.
  anchorToStage: true,
  // El fondo es casi 4:3 y las pantallas no: con recorte se perdía el banner en
  // portátil y, en móvil vertical, Sina y la pizarra entera. Se muestra completo
  // y las franjas se rellenan con una copia borrosa del propio fondo.
  fitStage: true,
  moments: 5,

  cast: {
    // Toda la geometría sale de medir los recortes sobre el boceto aprobado
    // (1451x1084): los personajes se generaron en las mismas coordenadas que el
    // fondo, así que cada capa vuelve exactamente a su sitio.
    // El orden es orden de dibujo: `max` va antes que `girl` porque ella está
    // delante y le tapa las piernas.
    globo:  { name:'Globo', color:'#E74C3C', x:0.113, bottom:0.201, height:0.391, width:0.192, headTop:0.408, shadow:false,
              framing:{scale:1.16,target:0.113,ty:0}, expressions:{ base:A('globo.png'), front:A('globo_front.png') } },
    thomas: { name:'Thomas', color:'#64748B', x:0.314, bottom:0.166, height:0.364, width:0.161, headTop:0.470, shadow:false,
              framing:{scale:1.16,target:0.314,ty:0}, expressions:{ base:A('thomas.png') } },
    max:    { name:'Max', color:'#E67E22', x:0.574, bottom:0.486, height:0.244, width:0.174, headTop:0.270, shadow:false,
              framing:{scale:1.16,target:0.574,ty:0}, expressions:{ base:A('max.png') } },
    girl:   { name:'Estudiante', color:'#9B59B6', x:0.527, bottom:0.097, height:0.535, width:0.216, headTop:0.515, shadow:false,
              framing:{scale:1.16,target:0.527,ty:0}, expressions:{ base:A('girl.png'), point:A('girl_point.png') } },
    sina:   { name:'Sina', color:'#00A896', x:0.856, bottom:0.238, height:0.389, width:0.138, headTop:0.373, shadow:false,
              framing:{scale:1.16,target:0.856,ty:0}, expressions:{ base:A('sina.png') } },
  },

  script: [
    { who:'narrator', frame:'wide',
      text:'El campamento arranca. Max reúne a todos para explicar cómo se compite.' },

    // M0 — puntos
    { m:0, who:'max',
      text:'En este campamento todo funciona con puntos. Cada reto que completes suma — para ti y para tu equipo.' },

    // M1 — learn per win + elección
    // Sina pregunta desde su pose fija: el texto sobre ella basta.
    { m:1, who:'sina', act:'choice',
      text:'Hay una frase que lo define todo aquí: learn per win. ¿Qué les viene a la mente?',
      opts:[
        { label:'Que hay que practicar mucho.',              go:()=>{ S.exact=false; scene.advance(); } },
        { label:'Que es muy difícil.',                       go:()=>{ S.exact=false; scene.advance(); } },
        { label:'Que hay que aprender para poder ganar.',    go:()=>{ S.exact=true;  scene.advance(); } },
      ] },
    // Globo se gira a cámara: le está respondiendo al jugador, no a la escena.
    { m:1, who:'globo', exp:{globo:'front'}, symbol:'✨',
      text:()=> S.exact ? '¡Exacto! El conocimiento es la clave para ganar.'
                        : 'En otras palabras: el conocimiento es la clave para ganar.' },

    // M2 — la estudiante pregunta
    { m:2, who:'girl', exp:{girl:'point', globo:'base'},
      text:'¿Y si no sé algo? ¿Podría aprender jugando?' },
    { m:2, who:'sina', exp:{girl:'base'},
      text:'¡Por supuesto! Cuando completas una actividad, aparece información importante que deberás recordar para los próximos juegos.' },

    // M3 — tablas
    { m:3, who:'max',
      text:'Y para saber cómo van, hay dos tablas: una por equipos, para ver qué grupo lidera, y una individual, con los mejores competidores del campamento.' },

    // M4 — Thomas cierra la escena. Está de espaldas, así que su alegría no se
    // ve: la cuenta el narrador, que además hace de remate.
    { m:4, who:'thomas', fx:'warm', symbol:'🔬',
      text:'¡Al fin una competencia sobre lo que me gusta… la ciencia!' },
    { m:4, who:'narrator', fx:'warm', act:'end',
      text:'*Thomas no puede ocultar su alegría.*' },
  ],

  onEnd: finish,
});

async function finish() {
  if (uid) {
    try {
      // setDoc+merge: updateDoc falla con not-found si el doc no existe.
      await setDoc(doc(db,'estudiantes',uid), {
        paso2_completado:true, paso2_ts:serverTimestamp(),
      }, { merge: true });
    } catch(e){ console.warn('Firebase save error:', e); }
  }
  // PUNTOS debe coincidir con el "reward" que el mapa anuncia (+150 pts,
  // escalón "narrativa corta").
  window.parent.postMessage({tipo:'resultado_juego',paso:2,puntos:150,completado:true,tiempo_segundos:0},'*');
  document.getElementById('result').classList.add('show');
}

document.getElementById('finish-btn').addEventListener('click', () => {
  if (window.parent !== window) window.parent.postMessage({tipo:'cerrar_juego'},'*');
  else window.history.back();
});

const music = document.getElementById('bg-music');
music.volume = 0.3;
document.addEventListener('click', () => music.play().catch(()=>{}), {once:true});

onAuthStateChanged(auth, async user => {
  uid = user ? user.uid : null;
  if (uid) {
    try {
      const snap = await getDoc(doc(db,'estudiantes',uid));
      if (snap.exists()) S.playerName = snap.data().nombre || '';
    } catch(e){ console.warn('Firebase read error:', e); }
  }
  scene.start();
});
</script>
</body>
</html>
